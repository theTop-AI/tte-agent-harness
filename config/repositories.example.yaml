# Product repositories the harness can plan work in. Copy to config/repositories.yaml on a host
# and adjust `path` there; repositories.yaml is git-ignored because paths are per host.
#
# What is NOT here, on purpose: each repository's validation commands. They live in the
# repository's own committed `.claude/project.json` (`validate`, the tte-workflows convention),
# and `tte-harness evidence run` reads them from the worktree at run time, so they cannot drift
# from what the repository's CI and tte-workflows run. `tte-harness repos` prints them live.
#
# Observed on origin/main, 2026-11-12 (for reading only; the repository file wins):
#   tte-frontend  node, lint, format, typecheck, test, build, contract (when), e2e (when)
#   tte-engine    lint (make lint), tests (make test with DB), openapi (export_openapi --check), audit
#   tte-infra     fmt (terraform fmt -check), validate (terraform init -backend=false + validate)
#   tte-lab       diff (git diff --check), tests (.venv/bin/python -m pytest tests/)
schema: 1

defaults:
  base_branch: main
  project_config: .claude/project.json

repositories:
  tte-frontend:
    github: theTop-AI/tte-frontend
    path: /home/ubuntu/projects/tte-frontend
    kind: frontend
    summary: pnpm + Turborepo monorepo, TanStack Start (SSR), React, Tailwind v4, shadcn/ui.
    context: [AGENTS.md, README.md, docs/CONVENTIONS.md, docs/architecture/apps-web.md]
    # The engine contract is vendored and pinned here; changing it points the panel at another
    # engine release (tte-frontend ADR-0001), which is a decision, not an implementation detail.
    contract_paths:
      - packages/api-engine/contract/
      - packages/api-engine/src/generated/
    roles: [solution-architect, frontend-developer, frontend-qa, code-reviewer, integration-engineer]

  tte-engine:
    github: theTop-AI/tte-engine
    path: /home/ubuntu/projects/tte-engine
    kind: backend
    summary: "Python package contextbank: FastAPI /api/v1, gateway, memory store, router."
    context: [AGENTS.md, README.md, docs/README.md]
    # The committed /api/v1 contract, regenerated by scripts/export_openapi.py.
    contract_paths:
      - openapi.json
      - openapi-onboarding.json
      - openapi-onboarding-cell.json
    roles: [solution-architect, backend-developer, backend-qa, code-reviewer, integration-engineer]

  tte-infra:
    github: theTop-AI/tte-infra
    path: /home/ubuntu/projects/tte-infra
    kind: infrastructure
    summary: Terraform for the tte estate; a merge to main applies tte-dev.
    context: [AGENTS.md, README.md]
    # The panel's runtime contract (port, env names, /smoke) lives in modules/panel.
    contract_paths:
      - modules/panel/
    # No developer role writes here through the harness in v1: infrastructure changes stay with a
    # person (no terraform apply, no privileged AWS operations from agents).
    roles: [solution-architect, code-reviewer]

  tte-lab:
    github: theTop-AI/tte-lab
    path: /home/ubuntu/projects/tte-lab
    kind: experimental
    summary: Experiments, evals and the memory inspector; grade "experiment", no CI.
    context: [AGENTS.md, README.md]
    contract_paths: []
    roles: [solution-architect, backend-developer, backend-qa, code-reviewer]
